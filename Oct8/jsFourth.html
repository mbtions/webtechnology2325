        function generateTable() {
            let num = parseInt(prompt("Enter a number: ", "2"));
            document.getElementById("table").innerHTML = "";
            for (let i = 1; i <= 10; i++) {
                document.getElementById("table").innerHTML += `${num} x ${i} = ${num * i} <br>`;
            }
        }
