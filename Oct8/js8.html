<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week days</title>
</head>

<body>
    <script>
        // Using Array
        let day = parseInt(prompt("Enter a value in range [1, 7]"))
        days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        alert(days[day - 1]);
    </script>
</body>
